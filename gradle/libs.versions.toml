composeBom = "2024.10.01"
room = "2.7.0-alpha12"
navigation = "2.8.3"
ksp = "2.1.0-1.0.29"
work = "2.9.1"
kotlinxSerialization = "1.7.3"
sqlcipherVersion = "4.5.4"
